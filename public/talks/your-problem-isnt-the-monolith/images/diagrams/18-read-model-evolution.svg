<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .year-label    { font: 800 22px 'Inter', 'Arial', sans-serif; letter-spacing: 4px; fill: #00d4aa; }
      .year-sub      { font: 600 14px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
      .rm-title      { font: 800 22px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .rm-version    { font: 700 16px 'JetBrains Mono', 'Courier New', monospace; fill: #00d4aa; }
      .rm-meta       { font: 600 13px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
      .badge         { font: 700 11px 'Inter', 'Arial', sans-serif; letter-spacing: 1.5px; }
      .consumer-lbl  { font: 700 13px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .group-label   { font: 700 11px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; }
      .caption       { font: 700 15px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #ffffff; }
      .caption-sub   { font: 500 12px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Vertical separator -->
  <line x1="490" y1="60" x2="490" y2="660"
        stroke="#475569" stroke-width="1.5" stroke-dasharray="4,6" stroke-opacity="0.4"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- LEFT — Year 4                                    -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="245" y="90" text-anchor="middle" class="year-label">YEAR 4</text>
  <text x="245" y="115" text-anchor="middle" class="year-sub">1 INTERNAL CONSUMER</text>

  <!-- Read model card -->
  <rect x="120" y="170" width="250" height="140" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#00d4aa" stroke-width="2"/>
  <text x="245" y="215" text-anchor="middle" class="rm-title">Tax Read Model</text>
  <text x="245" y="248" text-anchor="middle" class="rm-version">v1</text>
  <text x="245" y="285" text-anchor="middle" class="rm-meta">IMPLICIT CONTRACT</text>

  <!-- Single arrow down -->
  <line x1="245" y1="310" x2="245" y2="395"
        stroke="#00d4aa" stroke-width="3"/>
  <polygon points="237,388 253,388 245,402" fill="#00d4aa"/>

  <!-- Single consumer -->
  <rect x="160" y="410" width="170" height="70" rx="12" fill="#00d4aa"/>
  <text x="245" y="453" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Tax Team</text>

  <text x="245" y="540" text-anchor="middle" class="caption-sub">No SLA. No version policy.</text>
  <text x="245" y="560" text-anchor="middle" class="caption-sub">No deprecation window.</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- RIGHT — Year 7                                   -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="880" y="90" text-anchor="middle" class="year-label">YEAR 7</text>
  <text x="880" y="115" text-anchor="middle" class="year-sub">6 INTERNAL · 2 EXTERNAL · EXPLICIT CONTRACT</text>

  <!-- Read model card (with badges) -->
  <rect x="700" y="150" width="360" height="180" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#00d4aa" stroke-width="2"/>
  <text x="880" y="195" text-anchor="middle" class="rm-title">Tax Read Model</text>
  <text x="880" y="225" text-anchor="middle" class="rm-version">v3</text>

  <!-- Badges -->
  <rect x="725" y="248" width="100" height="26" rx="13" fill="rgba(0,212,170,0.18)"/>
  <text x="775" y="265" text-anchor="middle" class="badge" fill="#00d4aa">SLA 99.9%</text>

  <rect x="835" y="248" width="100" height="26" rx="13" fill="rgba(59,130,246,0.18)"/>
  <text x="885" y="265" text-anchor="middle" class="badge" fill="#3b82f6">DEPRECATION 6mo</text>

  <rect x="945" y="248" width="90" height="26" rx="13" fill="rgba(245,158,11,0.18)"/>
  <text x="990" y="265" text-anchor="middle" class="badge" fill="#f59e0b">VERSIONED</text>

  <text x="880" y="310" text-anchor="middle" class="rm-meta">OWNED · NAMED · OBSERVABLE</text>

  <!-- Group labels above consumer rows -->
  <text x="700" y="385" class="group-label" fill="#00d4aa">INTERNAL · 6</text>
  <text x="1060" y="385" text-anchor="end" class="group-label" fill="#f97316">EXTERNAL · 2</text>

  <!-- Fan-out lines from read model bottom to consumers -->
  <!-- Read model bottom point: (880, 330) -->

  <!-- 8 consumers in 4x2 grid, top edge of pill is target -->
  <!-- Pill w=140, h=55, gap_x=14, gap_y=18 -->
  <!-- Row 1 y=400, Row 2 y=475 -->
  <!-- Col x: 540, 694, 848, 1002, 1156 — wait 5 cols, but we have 4 + 4 = 8 in 4×2 -->
  <!-- 4 cols at x: 540, 694, 848, 1002 (pills span to 540+140=680, 694+140=834, etc.) -->

  <!-- Top row centers: 610, 764, 918, 1072. Top y=400 -->
  <line x1="880" y1="330" x2="610" y2="400"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="880" y1="330" x2="764" y2="400"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="880" y1="330" x2="918" y2="400"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="880" y1="330" x2="1072" y2="400"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Bottom row centers: 610, 764, 918, 1072. Top y=475 -->
  <line x1="880" y1="330" x2="610" y2="475"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="880" y1="330" x2="764" y2="475"
        stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Last two go to external (orange) -->
  <line x1="880" y1="330" x2="918" y2="475"
        stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="880" y1="330" x2="1072" y2="475"
        stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Row 1 consumer pills (internal teal) -->
  <rect x="540" y="400" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="610" y="434" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Tax Team</text>

  <rect x="694" y="400" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="764" y="434" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Reports</text>

  <rect x="848" y="400" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="918" y="434" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Compliance</text>

  <rect x="1002" y="400" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="1072" y="434" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Audit</text>

  <!-- Row 2: 2 internal + 2 external -->
  <rect x="540" y="475" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="610" y="509" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Finance</text>

  <rect x="694" y="475" width="140" height="55" rx="10" fill="#00d4aa"/>
  <text x="764" y="509" text-anchor="middle" class="consumer-lbl" fill="#0f1729">DataLake</text>

  <rect x="848" y="475" width="140" height="55" rx="10" fill="#f97316"/>
  <text x="918" y="509" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Partner A</text>

  <rect x="1002" y="475" width="140" height="55" rx="10" fill="#f97316"/>
  <text x="1072" y="509" text-anchor="middle" class="consumer-lbl" fill="#0f1729">Partner B</text>

  <!-- Bottom caption -->
  <text x="640" y="660" text-anchor="middle" class="caption">SAME CONTRACT. BIGGER BLAST RADIUS.</text>
  <text x="640" y="685" text-anchor="middle" class="caption-sub">After extraction, the implicit becomes explicit.</text>
</svg>
