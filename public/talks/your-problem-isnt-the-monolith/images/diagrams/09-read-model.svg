<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill-label    { font: 800 22px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #0f1729; }
      .inner-label   { font: 700 18px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .inner-sub     { font: 500 13px 'Inter', 'Arial', sans-serif; fill: #94a3b8; letter-spacing: 1px; }
      .badge         { font: 700 11px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; }
      .event-name    { font: 700 19px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .event-ver     { font: 600 12px 'JetBrains Mono', 'Courier New', monospace; fill: #94a3b8; }
      .stream-title  { font: 700 14px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #3b82f6; }
      .forbidden     { font: 800 15px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #ef4444; }
      .forbidden-sub { font: 500 12px 'Inter', 'Arial', sans-serif; fill: #94a3b8; }
      .flow-label    { font: 700 13px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #00d4aa; }
      .caption       { font: 600 14px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
    </style>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4aa"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- ORDER (left)                                          -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="80" y="180" width="240" height="340" rx="22"
        fill="rgba(20,30,48,0.55)" stroke="#00d4aa" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="125" y="160" width="150" height="40" rx="20" fill="#00d4aa"/>
  <text x="200" y="187" text-anchor="middle" class="pill-label">ORDER</text>

  <!-- "Internal tables" container inside Order -->
  <rect x="115" y="240" width="170" height="160" rx="12"
        fill="rgba(15,23,41,0.85)" stroke="#475569" stroke-width="1.5"/>
  <!-- Table illustration (3 horizontal bars + lock) -->
  <rect x="135" y="262" width="130" height="10" rx="3" fill="#475569"/>
  <rect x="135" y="280" width="130" height="10" rx="3" fill="#475569"/>
  <rect x="135" y="298" width="130" height="10" rx="3" fill="#475569"/>
  <rect x="135" y="316" width="130" height="10" rx="3" fill="#475569"/>
  <text x="200" y="358" text-anchor="middle" class="inner-label">Internal tables</text>
  <text x="200" y="380" text-anchor="middle" class="badge" fill="#ef4444">PRIVATE</text>

  <!-- "Publishes events" label below -->
  <text x="200" y="450" text-anchor="middle" class="flow-label">PUBLISHES EVENTS</text>
  <text x="200" y="475" text-anchor="middle" class="inner-sub">Owns the schema. Owns the contract.</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TAX (right)                                            -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="960" y="180" width="240" height="340" rx="22"
        fill="rgba(20,30,48,0.55)" stroke="#00d4aa" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="1005" y="160" width="150" height="40" rx="20" fill="#00d4aa"/>
  <text x="1080" y="187" text-anchor="middle" class="pill-label">TAX</text>

  <!-- "Read projection" container inside Tax -->
  <rect x="995" y="240" width="170" height="160" rx="12"
        fill="rgba(15,23,41,0.85)" stroke="#475569" stroke-width="1.5"/>
  <!-- Projection illustration (lighter / derived view) -->
  <rect x="1015" y="262" width="130" height="10" rx="3" fill="#1e3a52"/>
  <rect x="1015" y="280" width="130" height="10" rx="3" fill="#1e3a52"/>
  <rect x="1015" y="298" width="130" height="10" rx="3" fill="#1e3a52"/>
  <text x="1080" y="345" text-anchor="middle" class="inner-label">Local projection</text>
  <text x="1080" y="370" text-anchor="middle" class="inner-sub">order lines</text>
  <text x="1080" y="388" text-anchor="middle" class="inner-sub">shipping addresses</text>

  <!-- "Subscribes to events" label below -->
  <text x="1080" y="450" text-anchor="middle" class="flow-label">SUBSCRIBES TO EVENTS</text>
  <text x="1080" y="475" text-anchor="middle" class="inner-sub">Builds its own copy. Owns its schema.</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- FORBIDDEN PATH (top center) — direct table query       -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="640" y="100" text-anchor="middle" class="forbidden">✕  DIRECT TABLE QUERY</text>
  <text x="640" y="122" text-anchor="middle" class="forbidden-sub">would couple Tax to Order's schema forever</text>

  <!-- Dashed red line from Order right edge to Tax left edge -->
  <line x1="320" y1="260" x2="544" y2="260"
        stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,6" stroke-opacity="0.55"/>
  <line x1="736" y1="260" x2="960" y2="260"
        stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,6" stroke-opacity="0.55"/>
  <!-- X mark in the middle -->
  <line x1="610" y1="230" x2="670" y2="290" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="670" y1="230" x2="610" y2="290" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- EVENT STREAM (bottom middle) — the correct path        -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="360" y="540" width="560" height="140" rx="16"
        fill="rgba(20,30,48,0.65)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5"/>
  <text x="640" y="568" text-anchor="middle" class="stream-title">EVENTS PUBLISHED BY ORDER</text>

  <!-- OrderPlaced event ticket -->
  <rect x="390" y="585" width="240" height="75" rx="10" fill="#00d4aa"/>
  <text x="510" y="618" text-anchor="middle" class="event-name">OrderPlaced</text>
  <text x="510" y="640" text-anchor="middle" class="event-ver" fill="#0f1729">v3</text>

  <!-- OrderShipped event ticket -->
  <rect x="650" y="585" width="240" height="75" rx="10" fill="#3b82f6"/>
  <text x="770" y="618" text-anchor="middle" class="event-name">OrderShipped</text>
  <text x="770" y="640" text-anchor="middle" class="event-ver" fill="#0f1729">v2</text>

  <!-- Arrow: Order → events -->
  <path d="M 200 520 Q 200 580 360 610" fill="none" stroke="#00d4aa" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Arrow: events → Tax -->
  <path d="M 920 610 Q 1080 580 1080 520" fill="none" stroke="#00d4aa" stroke-width="3" marker-end="url(#arrow-teal)"/>
</svg>
