<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pill-label    { font: 800 16px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #0f1729; }
      .domain-label  { font: 700 15px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .service-label { font: 800 19px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .event-label   { font: 700 11px 'JetBrains Mono', 'Courier New', monospace; fill: #00d4aa; }
      .event-sub     { font: 500 10px 'Inter', 'Arial', sans-serif; letter-spacing: 1px; fill: #94a3b8; }
      .caption       { font: 600 13px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #94a3b8; }
    </style>
    <marker id="arrow-teal-sm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4aa"/>
    </marker>
  </defs>

  <!-- ── Left: smaller monolith with 5 remaining domains ── -->
  <rect x="40" y="80" width="280" height="430" rx="20"
        fill="rgba(20,30,48,0.45)" stroke="#00d4aa" stroke-width="2.5" stroke-opacity="0.55"/>
  <rect x="100" y="60" width="160" height="36" rx="18" fill="#00d4aa"/>
  <text x="180" y="84" text-anchor="middle" class="pill-label">MONOLITH</text>

  <!-- 5 stacked domain tiles inside -->
  <rect x="65" y="120" width="230" height="64" rx="10" fill="#00d4aa"/>
  <text x="180" y="158" text-anchor="middle" class="domain-label">Identity &amp; Accounts</text>

  <rect x="65" y="192" width="230" height="64" rx="10" fill="#3b82f6"/>
  <text x="180" y="230" text-anchor="middle" class="domain-label">Catalog</text>

  <rect x="65" y="264" width="230" height="64" rx="10" fill="#f59e0b"/>
  <text x="180" y="302" text-anchor="middle" class="domain-label">Orders</text>

  <rect x="65" y="336" width="230" height="64" rx="10" fill="#06b6d4"/>
  <text x="180" y="374" text-anchor="middle" class="domain-label">Fulfillment</text>

  <rect x="65" y="408" width="230" height="64" rx="10" fill="#f97316"/>
  <text x="180" y="446" text-anchor="middle" class="domain-label">Pricing &amp; Promotions</text>

  <!-- ── Right: 3 extracted services ── -->
  <!-- Search -->
  <rect x="540" y="100" width="220" height="100" rx="14"
        fill="rgba(20,30,48,0.55)" stroke="#22c55e" stroke-width="2.5"/>
  <text x="650" y="158" text-anchor="middle" class="service-label" fill="#22c55e">Search</text>

  <!-- Tax -->
  <rect x="540" y="250" width="220" height="100" rx="14"
        fill="rgba(20,30,48,0.55)" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="650" y="308" text-anchor="middle" class="service-label" fill="#8b5cf6">Tax</text>

  <!-- Payments -->
  <rect x="540" y="400" width="220" height="100" rx="14"
        fill="rgba(20,30,48,0.55)" stroke="#ef4444" stroke-width="2.5"/>
  <text x="650" y="458" text-anchor="middle" class="service-label" fill="#ef4444">Payments</text>

  <!-- ── Versioned event contract arrows ── -->
  <!-- to Search -->
  <line x1="320" y1="150" x2="540" y2="150"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow-teal-sm)"/>
  <text x="430" y="138" text-anchor="middle" class="event-label">ProductPublished v4</text>
  <text x="430" y="170" text-anchor="middle" class="event-sub">VERSIONED CONTRACT</text>

  <!-- to Tax -->
  <line x1="320" y1="300" x2="540" y2="300"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow-teal-sm)"/>
  <text x="430" y="288" text-anchor="middle" class="event-label">OrderPlaced v3</text>
  <text x="430" y="320" text-anchor="middle" class="event-sub">VERSIONED CONTRACT</text>

  <!-- to Payments -->
  <line x1="320" y1="450" x2="540" y2="450"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arrow-teal-sm)"/>
  <text x="430" y="438" text-anchor="middle" class="event-label">PaymentRequested v2</text>
  <text x="430" y="470" text-anchor="middle" class="event-sub">VERSIONED CONTRACT</text>

  <!-- Bottom caption -->
  <text x="400" y="555" text-anchor="middle" class="caption">3 EXTRACTED. 5 REMAINING. SAME SEAMS.</text>
</svg>
