<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label-mono     { font: 800 22px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #0f1729; }
      .domain-label   { font: 700 22px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .one-deployment { font: 600 16px 'Inter', 'Arial', sans-serif; letter-spacing: 4px; fill: #94a3b8; }
      .sidebar-title  { font: 700 18px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
      .stat-big       { font: 900 64px 'Inter', 'Arial', sans-serif; }
      .stat-small     { font: 600 22px 'Inter', 'Arial', sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Monolith outer boundary (subtle teal stroke, no fill — slide bg shows through) -->
  <rect x="40" y="80" width="900" height="580" rx="22"
        fill="rgba(20,30,48,0.4)" stroke="#00d4aa" stroke-width="2" stroke-opacity="0.45"/>

  <!-- MONOLITH pill centered on the top edge -->
  <rect x="395" y="60" width="190" height="40" rx="20" fill="#00d4aa"/>
  <text x="490" y="87" text-anchor="middle" class="label-mono">MONOLITH</text>

  <!-- ONE DEPLOYMENT label at the bottom -->
  <text x="490" y="685" text-anchor="middle" class="one-deployment">ONE DEPLOYMENT</text>

  <!-- ── Domain tiles · 4 columns × 2 rows ── -->
  <!-- Column x: 64, 283, 502, 721  (width 195, gap 24) -->
  <!-- Row    y: 124, 356           (height 208, gap 24) -->

  <!-- Row 1 -->
  <rect x="64"  y="124" width="195" height="208" rx="18" fill="#00d4aa"/>
  <text x="161" y="218" text-anchor="middle" class="domain-label">
    <tspan x="161" dy="0">Identity &amp;</tspan>
    <tspan x="161" dy="30">Accounts</tspan>
  </text>

  <rect x="283" y="124" width="195" height="208" rx="18" fill="#3b82f6"/>
  <text x="380" y="233" text-anchor="middle" class="domain-label">Catalog</text>

  <rect x="502" y="124" width="195" height="208" rx="18" fill="#f59e0b"/>
  <text x="600" y="233" text-anchor="middle" class="domain-label">Orders</text>

  <rect x="721" y="124" width="195" height="208" rx="18" fill="#ef4444"/>
  <text x="818" y="233" text-anchor="middle" class="domain-label">Payments</text>

  <!-- Row 2 -->
  <rect x="64"  y="356" width="195" height="208" rx="18" fill="#8b5cf6"/>
  <text x="161" y="465" text-anchor="middle" class="domain-label">Tax</text>

  <rect x="283" y="356" width="195" height="208" rx="18" fill="#22c55e"/>
  <text x="380" y="465" text-anchor="middle" class="domain-label">Search</text>

  <rect x="502" y="356" width="195" height="208" rx="18" fill="#06b6d4"/>
  <text x="600" y="465" text-anchor="middle" class="domain-label">Fulfillment</text>

  <rect x="721" y="356" width="195" height="208" rx="18" fill="#f97316"/>
  <text x="818" y="450" text-anchor="middle" class="domain-label">
    <tspan x="818" dy="0">Pricing &amp;</tspan>
    <tspan x="818" dy="30">Promotions</tspan>
  </text>

  <!-- ── Sidebar · outside the monolith ── -->
  <rect x="980" y="140" width="260" height="460" rx="18"
        fill="rgba(26,35,50,0.7)" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3"/>

  <text x="1110" y="190" text-anchor="middle" class="sidebar-title">SYSTEM SCALE</text>
  <line x1="1010" y1="215" x2="1210" y2="215" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3"/>

  <text x="1110" y="320" text-anchor="middle" class="stat-big" fill="#00d4aa">1M</text>
  <text x="1110" y="360" text-anchor="middle" class="stat-small">orders/day</text>

  <line x1="1010" y1="410" x2="1210" y2="410" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3"/>

  <text x="1110" y="515" text-anchor="middle" class="stat-big" fill="#3b82f6">25M</text>
  <text x="1110" y="555" text-anchor="middle" class="stat-small">SKUs</text>
</svg>
