<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .year-label    { font: 800 22px 'Inter', 'Arial', sans-serif; letter-spacing: 4px; fill: #00d4aa; }
      .year-sub      { font: 600 14px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
      .tx-banner     { font: 800 14px 'JetBrains Mono', 'Courier New', monospace; letter-spacing: 3px; fill: #f59e0b; }
      .tile-label    { font: 700 18px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .step-label    { font: 800 17px 'Inter', 'Arial', sans-serif; fill: #ffffff; }
      .step-num      { font: 800 13px 'JetBrains Mono', 'Courier New', monospace; fill: #0f1729; }
      .comp-label    { font: 700 11px 'JetBrains Mono', 'Courier New', monospace; letter-spacing: 1px; fill: #ef4444; }
      .comp-sub      { font: 500 10px 'Inter', 'Arial', sans-serif; letter-spacing: 1px; fill: #94a3b8; }
      .caption       { font: 700 15px 'Inter', 'Arial', sans-serif; letter-spacing: 3px; fill: #ffffff; }
      .caption-sub   { font: 500 12px 'Inter', 'Arial', sans-serif; letter-spacing: 2px; fill: #94a3b8; }
    </style>
    <marker id="arr-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4aa"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════════════ -->
  <!-- TOP HALF — Year 4 · single DB transaction       -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="100" y="76" class="year-label">YEAR 4</text>
  <text x="100" y="98" class="year-sub">ONE DISTRIBUTED TRANSACTION</text>

  <!-- Transaction container -->
  <rect x="140" y="120" width="1000" height="180" rx="16"
        fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="0"/>

  <!-- BEGIN / COMMIT banners -->
  <rect x="170" y="105" width="130" height="30" rx="6" fill="#f59e0b"/>
  <text x="235" y="125" text-anchor="middle" class="tx-banner" fill="#0f1729">BEGIN TX</text>

  <rect x="980" y="105" width="130" height="30" rx="6" fill="#f59e0b"/>
  <text x="1045" y="125" text-anchor="middle" class="tx-banner" fill="#0f1729">COMMIT</text>

  <!-- 4 service tiles inside transaction -->
  <rect x="180" y="170" width="200" height="100" rx="12" fill="#00d4aa"/>
  <text x="280" y="225" text-anchor="middle" class="tile-label">Order</text>

  <rect x="400" y="170" width="200" height="100" rx="12" fill="#ef4444"/>
  <text x="500" y="225" text-anchor="middle" class="tile-label">Payment</text>

  <rect x="620" y="170" width="200" height="100" rx="12" fill="#8b5cf6"/>
  <text x="720" y="225" text-anchor="middle" class="tile-label">Tax</text>

  <rect x="840" y="170" width="200" height="100" rx="12" fill="#06b6d4"/>
  <text x="940" y="225" text-anchor="middle" class="tile-label">Inventory</text>

  <!-- "ALL-OR-NOTHING" caption -->
  <text x="640" y="335" text-anchor="middle" class="caption-sub">ATOMIC ACROSS FOUR SERVICES — DOESN'T SCALE</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- BOTTOM HALF — Year 7 · process manager          -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="100" y="402" class="year-label">YEAR 7</text>
  <text x="100" y="424" class="year-sub">PROCESS MANAGER · EACH STEP COMPENSATED</text>

  <!-- 4 step boxes -->
  <!-- Step 1: PlaceOrder -->
  <rect x="80" y="460" width="220" height="120" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#00d4aa" stroke-width="2.5"/>
  <circle cx="115" cy="495" r="16" fill="#00d4aa"/>
  <text x="115" y="500" text-anchor="middle" class="step-num">1</text>
  <text x="190" y="530" text-anchor="middle" class="step-label">PlaceOrder</text>

  <!-- compensation under step 1 -->
  <text x="190" y="615" text-anchor="middle" class="comp-sub">↺ COMPENSATE</text>
  <text x="190" y="635" text-anchor="middle" class="comp-label">CancelOrder</text>

  <!-- Step 2: AuthorizePayment -->
  <rect x="335" y="460" width="220" height="120" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="370" cy="495" r="16" fill="#3b82f6"/>
  <text x="370" y="500" text-anchor="middle" class="step-num">2</text>
  <text x="445" y="530" text-anchor="middle" class="step-label">AuthorizePayment</text>

  <text x="445" y="615" text-anchor="middle" class="comp-sub">↺ COMPENSATE</text>
  <text x="445" y="635" text-anchor="middle" class="comp-label">RefundPayment</text>

  <!-- Step 3: ApplyTaxes -->
  <rect x="590" y="460" width="220" height="120" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="625" cy="495" r="16" fill="#8b5cf6"/>
  <text x="625" y="500" text-anchor="middle" class="step-num">3</text>
  <text x="700" y="530" text-anchor="middle" class="step-label">ApplyTaxes</text>

  <text x="700" y="615" text-anchor="middle" class="comp-sub">↺ COMPENSATE</text>
  <text x="700" y="635" text-anchor="middle" class="comp-label">RevertTaxes</text>

  <!-- Step 4: ReserveInventory -->
  <rect x="845" y="460" width="220" height="120" rx="14"
        fill="rgba(20,30,48,0.65)" stroke="#06b6d4" stroke-width="2.5"/>
  <circle cx="880" cy="495" r="16" fill="#06b6d4"/>
  <text x="880" y="500" text-anchor="middle" class="step-num">4</text>
  <text x="955" y="530" text-anchor="middle" class="step-label">ReserveInventory</text>

  <text x="955" y="615" text-anchor="middle" class="comp-sub">↺ COMPENSATE</text>
  <text x="955" y="635" text-anchor="middle" class="comp-label">ReleaseStock</text>

  <!-- Arrows between steps -->
  <line x1="300" y1="520" x2="335" y2="520"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arr-step)"/>
  <line x1="555" y1="520" x2="590" y2="520"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arr-step)"/>
  <line x1="810" y1="520" x2="845" y2="520"
        stroke="#00d4aa" stroke-width="2.5" marker-end="url(#arr-step)"/>

  <!-- Bottom caption -->
  <text x="640" y="690" text-anchor="middle" class="caption">CHOREOGRAPHY FOR SIMPLE PATHS. ORCHESTRATION FOR THE REST.</text>
</svg>
